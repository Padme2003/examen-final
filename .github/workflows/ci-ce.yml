name: CI/CD Andrade Project

on:
  push:
    branches: ["pilataxi"]   # ← requisito del examen: usar tu segundo apellido

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------------------------
    # DESCARGAR REPOSITORIO
    # ---------------------------------------------------------
    - name: 📥 Checkout repo
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # CONFIGURAR PYTHON
    # ---------------------------------------------------------
    - name: 🐍 Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ---------------------------------------------------------
    # FIX PARA QUE pytest ENCUENTRE app.py
    # ---------------------------------------------------------
    - name: 🛠️ Fix Python path
      run: echo "PYTHONPATH=." >> $GITHUB_ENV

    # ---------------------------------------------------------
    # EJECUTAR TESTS
    # ---------------------------------------------------------
    - name: 🧪 Run tests
      run: pytest -q

    # ---------------------------------------------------------
    # LOGIN GHCR
    # ---------------------------------------------------------
    - name: 🔐 Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # ---------------------------------------------------------
    # BUILD + PUSH DOCKER IMAGE
    # ---------------------------------------------------------
    - name: 🏗️ Build & Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/padme2003/pilataxi:1.0.5
          ghcr.io/padme2003/pilataxi:latest

    # ---------------------------------------------------------
    # SUBIR stack.yml AL VPS
    # ---------------------------------------------------------
    - name: 📤 Upload stack to VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/pilataxi-app"

    # ---------------------------------------------------------
    # DEPLOY EN DOCKER SWARM
    # ---------------------------------------------------------
    - name: 🚀 Deploy to VPS using Docker Swarm
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "🔄 Iniciando despliegue automático PILATAXI"

          cd ~/pilataxi-app

          echo "🔐 Login GHCR..."
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u padme2003 --password-stdin

          echo "📥 Pull de imagen..."
          docker pull ghcr.io/padme2003/pilataxi:latest

          echo "🧹 Eliminando stack anterior..."
          docker stack rm pilataxi_stack || true
          sleep 25

          echo "🚢 Desplegando nuevo stack..."
          docker stack deploy --with-registry-auth -c stack.yml pilataxi_stack

          echo "⏳ Esperando servicios..."
          sleep 20

          echo "📌 Contenedores activos:"
          docker ps
