version: "3.8"

services:
  pilataxi:
    image: ghcr.io/padme2003/pilataxi-examen:1.0.5
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pilataxi.entrypoints=http"
        - "traefik.http.routers.pilataxi.rule=Host(`pilataxi.byronrm.com`)"
        - "traefik.http.middlewares.pilataxi-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.pilataxi.middlewares=pilataxi-https-redirect"
        - "traefik.http.routers.pilataxi-secure.entrypoints=https"
        - "traefik.http.routers.pilataxi-secure.rule=Host(`pilataxi.byronrm.com`)"
        - "traefik.http.routers.pilataxi-secure.tls=true"
        - "traefik.http.routers.pilataxi-secure.tls.certresolver=http"
        - "traefik.http.routers.pilataxi-secure.service=pilataxi"
        - "traefik.http.services.pilataxi.loadbalancer.server.port=8080"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true